name: Nikki
description: Primary assistant -- operations, admin, scheduling, task management, and general support

telegram_bot_token_env: TELEGRAM_BOT_TOKEN

model: claude-opus-5

# Explicit main-channel MCP scope. This prevents stale project servers such as
# removed memory experiments from being inherited by the trusted Nikki runtime.
mcp_servers:
  - clickup
  - vendasta-crm

# Trusted interactive channels run without an SDK permission dialog. This
# explicit allowlist replaces blanket bypassPermissions while preserving the
# operational capabilities Dante already uses.
trusted_tools:
  - Read
  - Glob
  - Grep
  - WebSearch
  - WebFetch
  - TodoWrite
  - Skill
  - Bash
  - Write
  - Edit
  - NotebookEdit
  - Agent
  - mcp:clickup
  - mcp:vendasta-crm

obsidian:
  vault: /app/store/obsidian-brain
  folders:
    - Finance/
    - Inbox/
  read_only: []

# War Room tool opt-in. NOTE: this OVERRIDES the built-in default allowlist
# for this agent in the War Room. Safe read-only tools (Read/Glob/Grep/
# WebSearch/WebFetch/TodoWrite) are always included automatically; list
# every side-effect tool or `mcp:<server>` this agent should have here.
warroom_tools:
  - mcp:vendasta-crm
  - mcp:clickup
